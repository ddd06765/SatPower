services:
  - type: web
    name: satpower
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SATPOWER_SECRET
        generateValue: true
      - key: RENDER
        value: "1"
      - key: SATPOWER_DATA_DIR
        value: /opt/render/project/src/data
    disk:
      name: satpower-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
